<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Apocrycoin original concept artwork No. 01, "Sunset". Hand-built SVG. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16121c"/>
      <stop offset=".42" stop-color="#3d2d4c"/>
      <stop offset=".8" stop-color="#9c5b78"/>
      <stop offset="1" stop-color="#e48a70"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4070"/>
      <stop offset="1" stop-color="#16121c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7cfa4"/>
      <stop offset="1" stop-color="#e8806a"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d6274"/>
      <stop offset=".55" stop-color="#e9ded4"/>
      <stop offset="1" stop-color="#8d8090"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="500" cy="740" r="270"/></clipPath>
    <clipPath id="above"><rect width="1000" height="740"/></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".08"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="1000" height="740" fill="url(#sky)"/>
  <!-- glow -->
  <ellipse cx="500" cy="740" rx="420" ry="160" fill="#e8806a" opacity=".35" filter="url(#haze)"/>
  <!-- striped sun -->
  <g clip-path="url(#above)">
    <circle cx="500" cy="740" r="270" fill="url(#sun)"/>
    <g fill="#a95f7a" clip-path="url(#disc)">
      <rect x="200" y="600" width="600" height="6"/>
      <rect x="200" y="636" width="600" height="10"/>
      <rect x="200" y="672" width="600" height="15"/>
      <rect x="200" y="706" width="600" height="21"/>
    </g>
  </g>
  <!-- far shore -->
  <g fill="#241c2c">
    <rect x="0" y="722" width="170" height="18"/><rect x="40" y="706" width="70" height="16"/>
    <rect x="830" y="716" width="170" height="24"/><rect x="866" y="700" width="62" height="16"/>
  </g>
  <!-- water -->
  <rect y="740" width="1000" height="510" fill="url(#water)"/>
  <g fill="#f3c19c">
    <rect x="330" y="760" width="340" height="5" opacity=".85"/>
    <rect x="366" y="786" width="268" height="5" opacity=".7"/>
    <rect x="318" y="814" width="164" height="4" opacity=".55"/><rect x="514" y="814" width="170" height="4" opacity=".55"/>
    <rect x="392" y="844" width="216" height="4" opacity=".42"/>
    <rect x="356" y="876" width="104" height="3" opacity=".32"/><rect x="530" y="876" width="112" height="3" opacity=".32"/>
    <rect x="426" y="910" width="148" height="3" opacity=".22"/>
  </g>
  <!-- railing, foreground -->
  <path d="M-30 1110 L1030 958" stroke="url(#rail)" stroke-width="18" stroke-linecap="round"/>
  <path d="M-30 1104 L1030 952" stroke="#fff6ea" stroke-width="3" opacity=".6"/>
  <path d="M-30 1200 L1030 1048" stroke="#7d7082" stroke-width="10" stroke-linecap="round"/>
  <g stroke="#7d7082" stroke-width="13" stroke-linecap="round">
    <path d="M190 1083V1250"/><path d="M600 1024V1250"/><path d="M930 976V1250"/>
  </g>
  <rect width="1000" height="1250" filter="url(#grain)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
